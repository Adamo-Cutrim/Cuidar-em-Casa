<title>Cuidar em Casa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: coluna única de 520px, estilo app de celular.
   Cabeçalho fixo com o botão de valores, rota do dia como linha do tempo, abas na base e botão de ação flutuante. */
:root{
  --bg:#F1F6F4;
  --surface:#FFFFFF;
  --ink:#15302C;
  --muted:#5B726F;
  --line:#DAE6E2;
  --field:#C5D5D1;
  --accent:#1E7468;
  --accent-soft:#D9EFE8;
  --amber:#E2A13A;
  --amber-soft:#FBEED2;
  --amber-ink:#7A4E07;
  --ok:#2C8A58;
  --ok-soft:#DCF1E4;
  --ok-ink:#1B5E3A;
  --alert:#B03A2A;
  --alert-soft:#FBE4DF;
  --alert-ink:#7A2418;
  --c0-bg:#DAF0E8;--c0-fg:#15594A;
  --c1-bg:#DBE9F8;--c1-fg:#1B4B7C;
  --c2-bg:#E7E0F6;--c2-fg:#48388A;
  --c3-bg:#FBE5D3;--c3-fg:#85471A;
  --c4-bg:#F5EEC6;--c4-fg:#665709;
  --c5-bg:#F8DCE4;--c5-fg:#85294A;
  --display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
  --col:520px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);
  font:400 16px/1.45 var(--body);
  padding-block:0 150px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.55}
h1,h2,h3,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.app{max-width:var(--col);margin:0 auto}

/* Cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:16px 0 12px}
.top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.top-text{min-width:0}
h1{font:700 clamp(25px,7.2vw,31px)/1.08 var(--display);letter-spacing:-.015em;text-wrap:balance}
.sub{color:var(--muted);font-size:15px;margin-top:4px}
.eye{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 12px;border-radius:999px;border:1px solid var(--field);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap;flex:none}
.eye.on{background:var(--accent-soft);border-color:var(--accent);color:#0F4E44}

/* Aviso de exemplo e rodapé */
.notice{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--amber-soft);color:var(--amber-ink);border-radius:14px;padding:10px 12px 10px 14px;margin-bottom:14px;font-size:14px}
.notice p{flex:1 1 180px}
.foot{color:var(--muted);font-size:13px;margin-top:22px;text-align:center}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;border:1px solid var(--field);background:var(--surface);font-weight:600;font-size:15px;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--alert);border-color:#E7BEB6}
.btn.small{min-height:40px;padding:0 14px;font-size:14px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;border:0;background:transparent;flex:none}
.icon-btn.sm{width:40px;height:40px;border:1px solid var(--line);background:var(--surface)}

/* Semana */
.weekbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.weekstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:70px;padding:9px 0 8px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.day .dw{font-size:12.5px;color:var(--muted);font-weight:500}
.day .dn{font:600 19px/1.15 var(--display);font-variant-numeric:tabular-nums}
.day .dots{display:flex;gap:3px;height:6px;margin-top:2px}
.day .dots i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day.today .dw{color:var(--accent);font-weight:700}
.day.sel{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:none}
.day.sel .dw{color:rgba(255,255,255,.78)}
.day.sel .dots i{background:#fff}
.weeksum{margin:14px 2px 4px;color:var(--muted);font-size:14.5px}
.weeksum strong{color:var(--ink)}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:20px 2px 12px}
.dayhead h2{font:650 20px/1.2 var(--display);letter-spacing:-.01em}
.dayhead span{color:var(--muted);font-size:14px;white-space:nowrap}

/* Rota do dia */
.route{margin:0}
.stop{display:grid;grid-template-columns:50px 16px minmax(0,1fr);column-gap:10px;padding-bottom:12px}
.stop-time{font:600 17px/1.2 var(--display);font-variant-numeric:tabular-nums;text-align:right;padding-top:15px}
.rail{position:relative}
.node{position:absolute;left:50%;top:19px;width:14px;height:14px;transform:translateX(-50%);border-radius:50%;background:var(--surface);border:3px solid var(--accent);transition:background .25s,border-color .25s}
.rail::after{content:"";position:absolute;left:50%;top:36px;bottom:-12px;width:2px;transform:translateX(-50%);background:var(--line)}
.stop:last-child .rail::after{display:none}
.stop.feito .node{background:var(--ok);border-color:var(--ok)}
.stop.cancelado .node{border-color:#A9B9B5;border-style:dashed;background:var(--bg)}
.stop.next .node{border-color:var(--amber);box-shadow:0 0 0 4px var(--amber-soft)}
.stop-card{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;width:100%;min-width:0;text-align:left;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.stop.next .stop-card{border-color:#EBC77F}
.stop-main{display:flex;flex-direction:column;gap:3px;min-width:0}
.stop-name{font-weight:650;font-size:16.5px;overflow-wrap:anywhere}
.stop.cancelado .stop-name{text-decoration:line-through;color:var(--muted)}
.stop-meta{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.stop-main .chip{align-self:flex-start;margin-top:4px}
.stop-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.money{font-weight:650;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.money.none{color:var(--muted);font-weight:500}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:650;line-height:1.5;background:var(--accent-soft);color:#0F4E44}
.badge.feito{background:var(--ok-soft);color:var(--ok-ink)}
.badge.cancelado{background:#E9EFED;color:#4A5F5C}
.badge.next{background:var(--amber-soft);color:var(--amber-ink)}
.badge .i{width:13px;height:13px;stroke-width:3}
.empty{background:var(--surface);border:1px dashed var(--field);border-radius:16px;padding:22px 18px;text-align:center;display:grid;gap:12px;justify-items:center;color:var(--muted)}

/* Etiquetas de empresa e avatares */
.chip{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:650;line-height:1.55}
.ex{display:inline-block;margin-left:6px;padding:0 7px;border-radius:999px;background:var(--amber-soft);color:var(--amber-ink);font-size:11.5px;font-weight:650;vertical-align:2px}
.c0{background:var(--c0-bg);color:var(--c0-fg)}
.c1{background:var(--c1-bg);color:var(--c1-fg)}
.c2{background:var(--c2-bg);color:var(--c2-fg)}
.c3{background:var(--c3-bg);color:var(--c3-fg)}
.c4{background:var(--c4-bg);color:var(--c4-fg)}
.c5{background:var(--c5-bg);color:var(--c5-fg)}
.none{background:#E6EDEB;color:#465C59}
.av{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;font:650 16px var(--display);flex:none}
.av.sq{border-radius:14px}
.av.lg{width:56px;height:56px;font-size:20px}

/* Listas */
.search{position:relative;margin-bottom:10px}
.search .i{position:absolute;left:14px;top:13px;color:var(--muted);pointer-events:none}
.search input{padding-left:44px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px}
.fchip{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--field);background:var(--surface);font-size:14px;font-weight:600}
.fchip.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.group{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left}
.group > li:first-child .row,.group > .row:first-child{border-top:0}
.row-main{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.row-name{font-weight:650;font-size:16.5px;overflow-wrap:anywhere}
.row-sub{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.row-main .chip{align-self:flex-start;margin-top:4px}
.row-side{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px;color:var(--muted);font-size:13.5px}
.row-side .money{color:var(--ink)}

/* Navegação inferior */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-width:var(--col);margin:0 auto}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;border-radius:14px}
.tab .pill{display:flex;align-items:center;justify-content:center;width:56px;height:30px;border-radius:999px;transition:background .2s}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] .pill{background:var(--accent-soft)}
.fab{position:fixed;z-index:20;bottom:calc(78px + env(safe-area-inset-bottom,0px));right:max(calc(16px + env(safe-area-inset-right,0px)),calc((100% - var(--col)) / 2 + 16px));display:inline-flex;align-items:center;gap:8px;min-height:52px;padding:0 20px 0 16px;border-radius:999px;border:0;background:var(--accent);color:#fff;font-weight:700;font-size:15px;box-shadow:0 6px 18px rgba(30,116,104,.3)}

/* Formulários */
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
input,select,textarea{display:block;width:100%;min-width:0;min-height:48px;padding:10px 12px;border:1px solid var(--field);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
textarea{min-height:88px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:0}
fieldset{border:0;padding:0;margin:0;min-width:0}
fieldset + fieldset{margin-top:10px;padding-top:6px;border-top:1px solid var(--line)}
legend{font:650 18px/1.2 var(--display);padding:14px 0 0}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hint{color:var(--muted);font-size:13.5px;margin-top:6px}
.err{color:var(--alert);font-weight:600;font-size:14px;margin-top:12px;min-height:0}
.err:empty{display:none}

/* Janela de baixo para cima */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(21,48,44,.38);animation:fade .2s ease-out}
.sheet{position:fixed;z-index:41;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,var(--col));max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;background:var(--bg);border-radius:24px 24px 0 0;animation:rise .24s ease-out}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
.sheet-head h2{font:700 22px/1.15 var(--display);letter-spacing:-.01em;overflow-wrap:anywhere}
.sheet-head h2:focus{outline:none}
.sheet-body{overflow-y:auto;padding:4px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-actions{display:grid;gap:10px;margin-top:20px}
.sheet-actions .two{gap:10px}
.sheet-actions[hidden]{display:none}

/* Entrada e conta */
body.locked{padding-block:0}
body.locked .app,body.locked .fab,body.locked .tabbar{display:none}
#gate{min-height:100vh;min-height:100dvh;display:flex;justify-content:center}
#gate[hidden]{display:none}
.gate-in{width:100%;max-width:var(--col);padding:max(22px,env(safe-area-inset-top,0px)) 0 36px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.mark{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:var(--accent);color:#fff}
.bn{font:700 19px/1 var(--display);letter-spacing:-.01em}
.route{background:var(--accent-soft);border-radius:24px;padding:8px 10px 4px;margin-bottom:24px}
.route svg{display:block;width:100%;height:auto;overflow:visible}
.rt-line{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-dasharray:.1 9}
.rt-stop{fill:var(--surface);stroke:var(--accent);stroke-width:3}
.rt-t{font:600 11.5px var(--body);fill:#0F4E44}
.gate-form{margin-top:6px}
.gate-form .sheet-actions{margin-top:18px}
.gate-msg{background:var(--accent-soft);color:#0F4E44;border-radius:14px;padding:11px 14px;font-weight:600;font-size:14.5px;margin-top:14px}
.pwf{position:relative}
.pwf input{padding-right:92px}
.pwf button{position:absolute;right:6px;top:50%;transform:translateY(-50%);min-height:40px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:var(--accent);font-weight:700;font-size:14px}
.fine{color:var(--muted);font-size:13.5px;margin-top:16px;text-wrap:pretty}
.wait{display:flex;align-items:center;gap:12px;color:var(--muted);font-weight:600;margin-top:18px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--field);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.rep-btn{width:100%;margin-bottom:12px}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--surface);border:1px solid var(--line);margin-top:12px}
.seg button{flex:1;min-height:42px;border:0;border-radius:10px;background:transparent;font-weight:600;font-size:14.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 2px}
.mn-t{font:650 18px var(--display)}
.rep-custom{display:grid;gap:4px;margin-top:4px}
.rep-custom .btn{margin-top:10px}
.rep-tiles{display:grid;grid-template-columns:1.25fr 1fr;gap:10px;margin:14px 0 4px}
.rep-filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}
.rep-filters select{padding-right:6px}
@media (max-width:340px){.rep-filters{grid-template-columns:1fr}}
.tile{border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tile .tl{font-size:13.5px;font-weight:600}
.tile .tv{font:700 24px/1.1 var(--display);letter-spacing:-.01em;overflow-wrap:anywhere}
.tile .tv .money{color:inherit}
.tile .ts{font-size:13.5px}
.tile.real{background:var(--accent);color:#fff}
.tile.prev{background:var(--surface);border:1px solid var(--line)}
.tile.prev .tl,.tile.prev .ts{color:var(--muted)}
.rep-list li+li{border-top:1px solid var(--line)}
.rrow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 14px}
.rr-main{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.rr-vals{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none;text-align:right}
.rr-real{font-weight:700;font-size:16.5px;font-variant-numeric:tabular-nums}
.rr-prev{color:var(--muted);font-size:13.5px}
.rr-real .money,.rr-prev .money{color:inherit}
.rrow.total{background:var(--accent-soft)}
.mi{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--accent-soft);color:var(--accent);flex:none}
.row .go{color:var(--muted);flex:none}
.soon{background:var(--surface);border:1px dashed var(--field);border-radius:18px;padding:20px 16px;text-align:center;color:var(--muted)}
.soon strong{display:block;color:var(--ink);font:650 17px/1.2 var(--display);margin-bottom:6px}
.sec{margin-top:18px;padding-top:6px;border-top:1px solid var(--line)}
.sec h3{font:650 18px/1.2 var(--display);padding-top:12px}
.confirm{display:grid;gap:10px;background:var(--alert-soft);color:var(--alert-ink);border-radius:14px;padding:12px}
.confirm[hidden]{display:none}
@keyframes rise{from{transform:translate(-50%,28px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* Detalhes */
.sum{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.sum h3{font:700 20px/1.2 var(--display);overflow-wrap:anywhere}
.sum p{color:var(--muted);font-size:14.5px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 14px;margin-top:12px}
.kv{display:grid}
.kv > div{padding:11px 0;border-top:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.kv > div:first-child{border-top:0}
.kv .k{display:block;color:var(--muted);font-size:13.5px;margin-bottom:2px}
.kv .v{overflow-wrap:anywhere;user-select:text;white-space:pre-wrap}
.kv .grow{min-width:0;flex:1}
.kv a{color:var(--accent);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:4px;margin-top:6px;min-height:32px}
.kv a .i{width:16px;height:16px}
.alert{background:var(--alert-soft);color:var(--alert-ink);border-radius:14px;padding:11px 14px;font-size:15px;margin-top:12px}
.lead{font-size:16px;margin-bottom:2px}
.when{font-weight:600}
.ups{display:grid;gap:8px;margin-top:2px;padding:8px 0}
.ups li{display:flex;justify-content:space-between;gap:10px;font-size:14.5px}
.ups span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}

.check{display:flex;align-items:center;gap:12px;margin:14px 0 0;min-height:48px;font-size:16px;font-weight:600}
.check input{width:24px;height:24px;min-height:0;padding:0;flex:none;accent-color:var(--accent)}
.lrow{display:flex;align-items:center;gap:12px;margin:0;min-height:64px;padding:10px 14px;border-top:1px solid var(--line);font-weight:400}
.group li:first-child .lrow{border-top:0}
.lrow input{width:24px;height:24px;min-height:0;padding:0;flex:none;accent-color:var(--accent)}
.lrow .row-name{font-weight:600}
.lrow[hidden]{display:none}
.lab{font-weight:600;font-size:14px;margin:14px 0 6px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dpick{position:relative;display:block;margin:0;font-weight:600}
.dpick input{position:absolute;inset:0;width:100%;height:100%;min-height:0;opacity:0;margin:0;padding:0;cursor:pointer}
.dpick span{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:12px;border:1px solid var(--field);background:var(--surface);font-size:14px}
.dpick input:checked + span{background:var(--accent);border-color:var(--accent);color:#fff}
.dpick input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px}
.rep{display:inline-flex;vertical-align:-3px;margin-left:6px;color:var(--accent)}
.rep .i{width:16px;height:16px}
.datef-row{display:flex;gap:8px}
.datef-row input{flex:1;padding-inline:12px}
.datef-btn{flex:none;width:54px;min-height:48px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;border:1px solid var(--accent);background:var(--accent-soft);color:#0F4E44}
.datef-btn .i{transition:transform .2s}
.datef-btn[aria-expanded="true"]{background:var(--accent);color:#fff}
.datef-btn[aria-expanded="true"] .i{transform:rotate(180deg)}
.cal{margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 8px 6px}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.cal-title{flex:1;text-align:center;font:650 17px var(--display)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal-wd{text-align:center;color:var(--muted);font-size:12.5px;font-weight:600;padding:4px 0}
.cal-day{min-height:42px;border:0;border-radius:12px;background:transparent;font:500 16px var(--body);font-variant-numeric:tabular-nums}
.cal-day.today{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent);font-weight:700}
.cal-day.sel{background:var(--ink);color:#fff;box-shadow:none}
.cal-foot{display:flex;justify-content:space-between;margin-top:4px}
.wheels{position:relative;display:flex;align-items:center;justify-content:center;gap:4px;height:220px}
.wheel-band{position:absolute;left:14px;right:14px;top:88px;height:44px;border-radius:12px;background:var(--accent-soft);pointer-events:none}
.wheel{position:relative;z-index:1;width:104px;height:220px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent);mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wheel:focus-visible{outline:3px solid var(--accent);outline-offset:-3px;border-radius:12px}
.wsp{height:88px}
.wi{height:44px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font:500 20px var(--body);font-variant-numeric:tabular-nums;color:var(--muted);cursor:pointer;user-select:none}
.wi.sel{color:var(--ink);font-weight:700;font-size:25px}
.wheel-sep{position:relative;z-index:1;font:700 25px var(--body);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;max-width:min(92vw,420px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14.5px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

<script>
(function(){
'use strict';

/* ---------- utilidades ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromIso=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x;};
const startOfWeek=d=>addDays(d,-d.getDay());
const WD=['dom','seg','ter','qua','qui','sex','sáb'];
const WDL=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
const MON=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const ic=n=>'<svg class="i" aria-hidden="true"><use href="#i-'+n+'"/></svg>';
const nowKey=()=>{const n=new Date();return iso(n)+' '+pad(n.getHours())+':'+pad(n.getMinutes());};
const TIPOS_EMPRESA=['Operadora de saúde','Clínica','Hospital','Empresa de home care','Particular ou outro'];
const TIPOS_ATEND=['Consulta','Curativo','Aplicação de medicação','Fisioterapia','Coleta de exame','Avaliação'];

function age(n){
  if(!n) return null;
  const b=fromIso(n),t=new Date();
  let a=t.getFullYear()-b.getFullYear();
  if(t.getMonth()<b.getMonth()||(t.getMonth()===b.getMonth()&&t.getDate()<b.getDate())) a--;
  return a>=0&&a<130?a:null;
}
function parseMoney(s){
  s=String(s||'').replace(/[^\d.,]/g,'');
  if(!s) return null;
  if(s.indexOf(',')>-1) s=s.replace(/\./g,'').replace(',','.');
  const n=Number(s);
  return isFinite(n)&&n>=0?Math.round(n*100)/100:NaN;
}
function weekLabel(){
  const a=fromIso(ui.weekStart),b=addDays(a,6);
  if(a.getMonth()===b.getMonth()) return a.getDate()+' a '+b.getDate()+' de '+MON[b.getMonth()];
  return a.getDate()+' de '+MON[a.getMonth()].slice(0,3)+'. a '+b.getDate()+' de '+MON[b.getMonth()].slice(0,3)+'.';
}
const dayTitle=d=>WDL[d.getDay()]+', '+d.getDate()+' de '+MON[d.getMonth()];

/* ---------- campo de data: digitar (dd/mm/aaaa) ou abrir o calendário na setinha ---------- */
const isoToBr=i=>i?String(i).split('-').reverse().join('/'):'';
function brToIso(t){
  const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(t).trim());
  if(!m) return null;
  const d=+m[1],mo=+m[2],y=+m[3];
  if(y<1900||y>2100||mo<1||mo>12||d<1) return null;
  const dt=new Date(y,mo-1,d);
  if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d) return null;
  return y+'-'+pad(mo)+'-'+pad(d);
}
function dateField(id,name,value,opt){
  opt=opt||{};
  return '<div class="datef"><div class="datef-row"><input id="'+id+'" name="'+name+'" type="text" data-kind="date" inputmode="numeric" autocomplete="off" placeholder="dd/mm/aaaa" maxlength="10" value="'+esc(isoToBr(value))+'">'+
    '<button type="button" class="datef-btn" data-action="open-cal" aria-label="Abrir calendário" aria-expanded="false" aria-controls="cal-'+id+'">'+ic('down')+'</button></div>'+
    '<div class="cal" id="cal-'+id+'" role="group" aria-label="Escolher data" hidden>'+
    '<div class="cal-head"><button type="button" class="icon-btn sm" data-action="cal-nav" data-dir="-1" aria-label="Mês anterior">'+ic('left')+'</button><span class="cal-title" aria-live="polite"></span><button type="button" class="icon-btn sm" data-action="cal-nav" data-dir="1" aria-label="Próximo mês">'+ic('right')+'</button></div>'+
    '<div class="cal-grid"></div>'+
    '<div class="cal-foot"><button type="button" class="btn small ghost" data-action="cal-today">Hoje</button>'+(opt.clear?'<button type="button" class="btn small ghost" data-action="cal-clear">Limpar</button>':'')+'</div></div></div>';
}
function maskDate(el){
  let v=el.value;
  if(/^\d{4}-\d{2}-\d{2}$/.test(v.trim())) v=isoToBr(v.trim());
  const pos=el.selectionStart==null?v.length:el.selectionStart;
  const before=v.slice(0,pos).replace(/\D/g,'').length;
  const d=v.replace(/\D/g,'').slice(0,8);
  const out=d.length>4?d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4):d.length>2?d.slice(0,2)+'/'+d.slice(2):d;
  if(out!==el.value){
    el.value=out;
    let c=0,n=0;
    while(c<out.length&&n<before){if(/\d/.test(out.charAt(c))) n++;c++;}
    try{el.setSelectionRange(c,c);}catch(e){}
  }
}
function parseTime(t){
  const m=/^(\d{1,2}):(\d{2})$/.exec(String(t).trim());
  if(!m) return null;
  const h=+m[1],mi=+m[2];
  if(h>23||mi>59) return null;
  return pad(h)+':'+pad(mi);
}
function timeField(id,name,value){
  const items=n=>Array.from({length:n},(_,i)=>'<div class="wi" role="option" aria-selected="false" data-action="wheel-pick">'+pad(i)+'</div>').join('');
  const wheel=(label,n)=>'<div class="wheel" role="listbox" tabindex="0" aria-label="'+label+'"><div class="wsp" aria-hidden="true"></div>'+items(n)+'<div class="wsp" aria-hidden="true"></div></div>';
  return '<div class="datef"><div class="datef-row"><input id="'+id+'" name="'+name+'" type="text" data-kind="time" inputmode="numeric" autocomplete="off" placeholder="hh:mm" maxlength="5" value="'+esc(value||'')+'">'+
    '<button type="button" class="datef-btn" data-action="open-time" aria-label="Abrir seletor de horário" aria-expanded="false" aria-controls="tp-'+id+'">'+ic('down')+'</button></div>'+
    '<div class="cal" id="tp-'+id+'" role="group" aria-label="Escolher horário" hidden><div class="wheels"><div class="wheel-band" aria-hidden="true"></div>'+wheel('Horas',24)+'<span class="wheel-sep" aria-hidden="true">:</span>'+wheel('Minutos',60)+'</div>'+
    '<div class="cal-foot"><button type="button" class="btn small ghost" data-action="time-done">Concluir</button></div></div></div>';
}
function maskTime(el){
  const raw=el.value;
  const pos=el.selectionStart==null?raw.length:el.selectionStart;
  let before=raw.slice(0,pos).replace(/\D/g,'').length;
  let d=raw.replace(/\D/g,'').slice(0,4);
  if(d.length&&d.charAt(0)>'2'){d=('0'+d).slice(0,4);before=Math.min(before+1,4);}
  const out=d.length>2?d.slice(0,2)+':'+d.slice(2):d;
  if(out!==el.value){
    el.value=out;
    let c=0,n=0;
    while(c<out.length&&n<before){if(/\d/.test(out.charAt(c))) n++;c++;}
    try{el.setSelectionRange(c,c);}catch(e){}
  }
}
/* Seletor em rolagem: cada roda tem itens de 44px que encaixam no centro; o número do meio é o escolhido. */
const WH=44;
const wheelIdx=wh=>Math.max(0,Math.min(wh.querySelectorAll('.wi').length-1,Math.round(wh.scrollTop/WH)));
function wheelMark(wh){
  const i=wheelIdx(wh);
  wh.querySelectorAll('.wi').forEach(function(e,k){
    const on=k===i;
    if(e.classList.contains('sel')!==on){e.classList.toggle('sel',on);e.setAttribute('aria-selected',on?'true':'false');}
  });
}
function wheelGo(wh,i,instant){
  const n=wh.querySelectorAll('.wi').length;
  wh.scrollTo({top:Math.max(0,Math.min(n-1,i))*WH,behavior:instant?'auto':'smooth'});
}
function timeApply(w){
  const ws=w.querySelectorAll('.wheel');
  $('input',w).value=pad(wheelIdx(ws[0]))+':'+pad(wheelIdx(ws[1]));
  const e=$('#f-err');if(e) e.textContent='';
}
function timeSync(w){
  const t=parseTime($('input',w).value)||'09:00';
  const ws=w.querySelectorAll('.wheel');
  [+t.slice(0,2),+t.slice(3)].forEach(function(v,k){
    const wh=ws[k];
    wh.dataset.lock='1';wh.scrollTop=v*WH;wheelMark(wh);
    setTimeout(function(){delete wh.dataset.lock;},250);
  });
}
function timeOpen(w){
  document.querySelectorAll('.datef').forEach(function(o){if(o!==w&&!$('.cal',o).hidden) calClose(o,false);});
  const cal=$('.cal',w);
  cal.hidden=false;$('.datef-btn',w).setAttribute('aria-expanded','true');
  timeSync(w);
  cal.scrollIntoView({block:'nearest'});
}
document.addEventListener('scroll',function(e){
  const wh=e.target;
  if(!wh||!wh.classList||!wh.classList.contains('wheel')) return;
  wheelMark(wh);
  if(wh.dataset.lock) return;
  clearTimeout(wh._t);
  wh._t=setTimeout(function(){timeApply(wh.closest('.datef'));},120);
},true);
function calRender(w){
  const cal=$('.cal',w),inp=$('input',w);
  const y=+cal.dataset.y,m=+cal.dataset.m;
  const sel=brToIso(inp.value),today=iso(new Date());
  const t=MON[m]+' de '+y;
  $('.cal-title',cal).textContent=t.charAt(0).toUpperCase()+t.slice(1);
  let h=WD.map(x=>'<span class="cal-wd" aria-hidden="true">'+x+'</span>').join('');
  for(let i=0;i<new Date(y,m,1).getDay();i++) h+='<span></span>';
  const n=new Date(y,m+1,0).getDate();
  for(let d=1;d<=n;d++){
    const k=y+'-'+pad(m+1)+'-'+pad(d);
    h+='<button type="button" class="cal-day'+(k===sel?' sel':'')+(k===today?' today':'')+'" data-action="cal-pick" data-iso="'+k+'" aria-label="'+esc(dayTitle(new Date(y,m,d))+' de '+y)+'"'+(k===sel?' aria-pressed="true"':'')+(k===today?' aria-current="date"':'')+'>'+d+'</button>';
  }
  $('.cal-grid',cal).innerHTML=h;
}
function calClose(w,focusBtn){
  const cal=$('.cal',w),b=$('.datef-btn',w);
  cal.hidden=true;b.setAttribute('aria-expanded','false');
  if(focusBtn) b.focus();
}
function calOpen(w){
  document.querySelectorAll('.datef').forEach(function(o){if(o!==w&&!$('.cal',o).hidden) calClose(o,false);});
  const cal=$('.cal',w),inp=$('input',w);
  const d=fromIso(brToIso(inp.value)||iso(new Date()));
  cal.dataset.y=d.getFullYear();cal.dataset.m=d.getMonth();
  cal.hidden=false;$('.datef-btn',w).setAttribute('aria-expanded','true');
  calRender(w);
  const f=$('.cal-day.sel',cal)||$('.cal-day.today',cal)||$('.cal-day',cal);
  if(f) f.focus();
  cal.scrollIntoView({block:'nearest'});
}
function calSet(w,isoVal){
  $('input',w).value=isoToBr(isoVal);
  const e=$('#f-err');if(e) e.textContent='';
  calClose(w,true);
}

/* ---------- estado e armazenamento ---------- */
const KEY='cuidar-em-casa:v1', HIDE_KEY='cuidar-em-casa:ocultar-valores', DOC='dados';
let S, hide=false, dbRef=null, dbMode='local', saveTimer=null, writing=false, dirty=false;
const ui={tab:'agenda',weekStart:iso(startOfWeek(new Date())),day:iso(new Date()),q:'',fcomp:'all'};

const CONTA_KEY='cuidar-em-casa:conta', SESS_KEY='cuidar-em-casa:sessao', MANTER_KEY='cuidar-em-casa:manter';
const auth={conta:null,logged:false,mode:'',msg:'',tent:0,bloqueio:0};
let contaRef=null, contaChecked=false;
function readSess(k){try{return sessionStorage.getItem(k);}catch(e){return null;}}
function writeSess(k,v){try{sessionStorage.setItem(k,v);}catch(e){}}
function delLocal(k){try{localStorage.removeItem(k);}catch(e){}}
function delSess(k){try{sessionStorage.removeItem(k);}catch(e){}}
function readLocal(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function writeLocal(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function normalize(o){
  o=o||{};
  return {patients:Array.isArray(o.patients)?o.patients:[],companies:Array.isArray(o.companies)?o.companies:[],visits:Array.isArray(o.visits)?o.visits:[],rev:Number(o.rev)||0,perfil:(o.perfil&&typeof o.perfil==='object')?o.perfil:{},tipos:Array.isArray(o.tipos)?o.tipos.filter(x=>typeof x==='string'&&x.trim()):undefined,persisted:true};
}
function makeDemo(){
  const comps=[
    {id:'ex-c1',nome:'Vida Plena Saúde',tipo:'Operadora de saúde',contato:'Marcos, (00) 3000-0101',valorPadrao:180,pagamento:'Pagamento até o dia 10',obs:'',cor:0,ex:true},
    {id:'ex-c2',nome:'Clínica Aurora',tipo:'Clínica',contato:'Dra. Paula, (00) 3000-0202',valorPadrao:150,pagamento:'Pagamento quinzenal',obs:'',cor:1,ex:true},
    {id:'ex-c3',nome:'Cuidar+ Home Care',tipo:'Empresa de home care',contato:'Renata, (00) 3000-0303',valorPadrao:220,pagamento:'Pagamento no dia 5 do mês seguinte',obs:'Enviar relatório mensal por e-mail.',cor:2,ex:true}

function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(flush,400);}
async function flush(){
  saveTimer=null;

  if(writing){dirty=true;return;}
  writing=true;
  try{
    do{dirty=false;await dbRef.set(JSON.parse(JSON.stringify(S)));}while(dirty);
    setMode('conta');
  }catch(e){setMode('local');}

async function initDb(){
  try{
    if(!window.claude||!window.claude.use) return;
    const r=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    const db=r[0],user=r[1];
    if(!db||!user) return;
    const id=await user.id();
    if(!id) return;
    dbRef=db.collection('data/users/'+id).doc(DOC);
    const t=setTimeout(function(){setMode('local');},10000);
    dbRef.onSnapshot(function(snap){
      clearTimeout(t);
      const remote=snap.exists?snap.data():null;
      const rr=remote?(Number(remote.rev)||0):0;
      if(remote&&rr>(S.rev||0)){
        S=normalize(JSON.parse(JSON.stringify(remote)));
        writeLocal(KEY,JSON.stringify(S));
        renderAll();
      }else if(S.persisted&&(S.rev||0)>rr&&!snap.metadata.fromCache){
        scheduleSave();
      }
      if(!snap.metadata.fromCache) setMode('conta');
    },function(){setMode('local');});
    contaRef=db.collection('data/users/'+id).doc('conta');
    try{
      const g=await Promise.race([contaRef.get(),new Promise(function(_,rj){setTimeout(rj,4000);})]);
      const rc=g.exists?JSON.parse(JSON.stringify(g.data())):null;
      if(rc&&validConta(rc)){
        if(!auth.conta||(rc.at||0)>(auth.conta.at||0)){auth.conta=rc;writeLocal(CONTA_KEY,JSON.stringify(rc));}
        else if((auth.conta.at||0)>(rc.at||0)) contaRef.set(auth.conta).catch(function(){});
      }else if(auth.conta) contaRef.set(auth.conta).catch(function(){});
    }catch(e){}
  }catch(e){}
  finally{contaChecked=true;decideGate();}
}

   Valor de cada atendimento = valor cadastrado no paciente. Feito = realizado. Agendado = previsto.
   Cancelados não entram. Atendimentos recorrentes ainda não registrados contam como agendados. */
let dlRef=null;
const pl=(n,a,b)=>n+' '+(n===1?a:b);
const brl=v=>BRL.format(Number(v)||0);
const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
function monthRange(y,m){const a=new Date(y,m,1),b=new Date(y,m+1,0);return {y:a.getFullYear(),m:a.getMonth(),from:iso(a),to:iso(b)};}
function repInit(o){
  const n=new Date(),r=monthRange(n.getFullYear(),n.getMonth());
  ui.rep={by:o.by==='empresa'?'empresa':'paciente',emp:o.emp||'all',pac:o.pac||'all',mode:'mes',y:r.y,m:r.m,from:r.from,to:r.to};
}

const noCompany=p=>!p.empresaId||!findCompany(p.empresaId);
function repData(){
  const r=ui.rep,rows={};
  const tot={feitos:0,ag:0,real:0,prev:0,pacs:{}};
  let semValor=0,pend=0;
  const now=nowKey();
  visitsBetween(r.from,r.to).forEach(function(v){
    if(v.status==='cancelado') return;
    const p=findPatient(v.pacienteId);if(!p) return;
    if(r.emp==='none'){if(!noCompany(p)) return;}
    else if(r.emp!=='all'&&p.empresaId!==r.emp) return;
    if(r.pac!=='all'&&p.id!==r.pac) return;
    const comp=noCompany(p)?null:findCompany(p.empresaId);
    const key=r.by==='empresa'?(comp?comp.id:'none'):p.id;
    const row=rows[key]||(rows[key]={key:key,nome:r.by==='empresa'?(comp?comp.nome:'Particulares'):p.nome,empresa:comp?comp.nome:'Particular',valor:(p.valor==null||p.valor==='')?null:pValue(p),feitos:0,ag:0,real:0,prev:0,pacs:{}});
    const val=pValue(p),sem=(p.valor==null||p.valor==='');
    if(sem) semValor++;
    row.pacs[p.id]=1;tot.pacs[p.id]=1;
    if(v.status==='feito'){row.feitos++;row.real+=val;tot.feitos++;tot.real+=val;}
    else{row.ag++;row.prev+=val;tot.ag++;tot.prev+=val;if((v.date+' '+(v.hora||'00:00'))<now) pend++;}
  });
  const list=Object.keys(rows).map(k=>rows[k]).sort(function(a,b){
    if(a.key==='none') return 1;if(b.key==='none') return -1;
    return a.nome.localeCompare(b.nome,'pt-BR');
  });
  return {rows:list,tot:tot,semValor:semValor,pend:pend};
}

const csvCell=v=>{let t=String(v==null?'':v);if(/^[=+\-@\t\r]/.test(t)) t="'"+t;return /[;"\n\r]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t;};

/* ---------- conta e acesso ----------
   A senha nunca é guardada em texto: só um hash PBKDF2 com sal. É uma trava para quem
   pega o aparelho, não substitui o login da própria conta Claude, que já protege os dados. */
const enc=new TextEncoder();
const b64=u=>btoa(String.fromCharCode.apply(null,u));
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
const cryptoOk=()=>!!(window.crypto&&crypto.subtle&&crypto.getRandomValues);
const normEmail=v=>String(v||'').trim().toLowerCase();
const emailOk=v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
function validConta(c){return !!c&&typeof c==='object'&&typeof c.nome==='string'&&typeof c.email==='string'&&typeof c.salt==='string'&&typeof c.hash==='string'&&Number(c.it)>0;}
async function hashPw(pw,salt,it){
  const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:salt,iterations:it},k,256);
  return b64(new Uint8Array(bits));
}
async function makeConta(nome,email,pw){
  const salt=crypto.getRandomValues(new Uint8Array(16)),it=150000;
  return {v:1,nome:nome,email:email,salt:b64(salt),it:it,hash:await hashPw(pw,salt,it),at:Date.now()};
}
async function checkPw(c,pw){return (await hashPw(pw,unb64(c.salt),Number(c.it)))===c.hash;}
function saveConta(c){
  c.at=Date.now();auth.conta=c;
  writeLocal(CONTA_KEY,JSON.stringify(c));
  if(contaRef) contaRef.set(JSON.parse(JSON.stringify(c))).catch(function(){});
}

function showGate(mode){

}
function decideGate(){
  if(auth.logged) return;
  if(auth.conta&&(readSess(SESS_KEY)==='1'||readLocal(MANTER_KEY)==='1')) return unlock();
  if(auth.mode==='reset'&&auth.conta) return;
  const m=auth.conta?'entrar':(contaChecked?'criar':'wait');
  if(m===auth.mode&&$('#gate').firstChild) return;
  if(auth.mode==='criar'&&m==='entrar') auth.msg='Você já tem uma conta. Entre com seu e-mail e senha.';
  showGate(m);
}

function senhaRegra(s1,s2){
  if(s1.length<8) return 'A senha precisa ter pelo menos 8 caracteres.';
  if(s1!==s2) return 'As duas senhas não são iguais.';
  return '';
}
async function doEntrar(f){
  const espera=auth.bloqueio-Date.now();
  if(espera>0) return fail(f,'Muitas tentativas. Aguarde '+Math.ceil(espera/1000)+' segundos e tente de novo.');
  const email=normEmail(fv(f,'email')),pw=fv(f,'senha');
  if(!email) return fail(f,'Informe o e-mail da sua conta.','email');
  if(!pw) return fail(f,'Informe a senha.','senha');
  if(!cryptoOk()) return fail(f,'Este navegador não permite verificar a senha. Abra o app em outro navegador.');
  setBusy(f,true);
  let ok=false;
  try{ok=(await checkPw(auth.conta,pw))&&email===auth.conta.email;}catch(e){}
  setBusy(f,false);
  if(!ok){
    auth.tent++;
    if(auth.tent>=5){auth.tent=0;auth.bloqueio=Date.now()+30000;return fail(f,'Muitas tentativas. Aguarde 30 segundos e tente de novo.','senha');}
    return fail(f,'E-mail ou senha incorretos.','senha');
  }
  entrar(f.elements.manter&&f.elements.manter.checked);
}
async function doCriar(f){
  const nome=cleanName(fv(f,'nome')),email=normEmail(fv(f,'email')),s1=fv(f,'senha'),s2=fv(f,'conf');
  if(!nome) return fail(f,'Informe seu nome.','nome');
  if(!emailOk(email)) return fail(f,'Informe um e-mail válido, como nome@exemplo.com.','email');
  const r=senhaRegra(s1,s2);if(r) return fail(f,r,'senha');
  if(!cryptoOk()) return fail(f,'Este navegador não permite proteger a senha. Abra o app em outro navegador.');
  setBusy(f,true);
  try{
    if(contaRef){
      try{
        const g=await Promise.race([contaRef.get(),new Promise(function(_,rj){setTimeout(rj,4000);})]);
        const rc=g.exists?JSON.parse(JSON.stringify(g.data())):null;
        if(rc&&validConta(rc)){
          auth.conta=rc;writeLocal(CONTA_KEY,JSON.stringify(rc));auth.msg='Você já tem uma conta. Entre com seu e-mail e senha.';
          setBusy(f,false);return showGate('entrar');
        }
      }catch(e){}
    }
    const c=await makeConta(nome,email,s1);
    saveConta(c);
    setBusy(f,false);
    entrar(f.elements.manter&&f.elements.manter.checked);
  }catch(e){setBusy(f,false);fail(f,'Não foi possível criar a conta. Tente de novo.');}
}
async function doReset(f){

  if(email!==auth.conta.email) return fail(f,'Esse e-mail não é o da conta.','email');

function renameTipo(old,nome){

/* Atendimentos recorrentes não são gravados um a um: aparecem na agenda a partir do cadastro do paciente.
   Só viram registro quando você conclui, edita, cancela ou exclui um deles. */
function recOccurs(p,date){
  const r=p&&p.rec;
  if(!r||!r.ativo||!Array.isArray(r.dias)) return false;
  if(r.dias.indexOf(fromIso(date).getDay())<0) return false;
  if(date<r.inicio||(r.fim&&date>r.fim)) return false;
  if((p.recExc||[]).indexOf(date)>-1) return false;
  return !S.visits.some(v=>v.serie===p.id&&v.serieData===date);
}
function virtualOf(p,date){
  return {id:'r-'+p.id+'-'+date,pacienteId:p.id,date:date,hora:p.rec.hora,tipo:p.rec.tipo||'',obs:'',status:'agendado',serie:p.id,serieData:date,virtual:true};
}
function visitsBetween(a,b){
  const out=S.visits.filter(v=>v.date>=a&&v.date<=b);
  const pats=S.patients.filter(p=>p.rec&&p.rec.ativo);
  if(pats.length){
    for(let d=fromIso(a),end=fromIso(b);d<=end;d=addDays(d,1)){
      const k=iso(d);
      pats.forEach(function(p){if(recOccurs(p,k)) out.push(virtualOf(p,k));});
    }
  }
  return out;
}
function visitById(id){
  const st=S.visits.find(x=>x.id===id);
  if(st) return st;
  if(String(id).indexOf('r-')===0){
    const p=findPatient(id.slice(2,-11)),date=id.slice(-10);
    if(p&&recOccurs(p,date)) return virtualOf(p,date);
  }
  return null;
}
function resolveVisit(id){
  const v=visitById(id);
  if(!v) return null;
  if(v.virtual){const m=Object.assign({},v);delete m.virtual;S.visits.push(m);return m;}
  return v;
}
function recSig(r){return r&&r.ativo?[r.dias.join(','),r.hora,r.tipo||'',r.inicio,r.fim||''].join('|'):'';}
/* Antes de trocar a regra: o passado recente fica como estava e o futuro volta a seguir a regra nova.
   Atendimentos que você mexeu à mão (remarcou, editou) ou já concluiu/cancelou são mantidos. */
function closeRecurrence(p){
  const today=iso(new Date()),floor=addDays(new Date(),-120),from=fromIso(p.rec.inicio);
  for(let d=from<floor?floor:from;iso(d)<today;d=addDays(d,1)){
    const k=iso(d);
    if(recOccurs(p,k)) resolveVisit('r-'+p.id+'-'+k);
  }
  S.visits=S.visits.filter(v=>!(v.serie===p.id&&v.status==='agendado'&&!v.manual&&v.date>=today));
  p.recExc=(p.recExc||[]).filter(x=>x<today);
}
function recText(p){
  const r=p.rec;
  if(!r||!r.ativo) return '';
  const nomes=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
  const ds=r.dias.slice().sort((a,b)=>((a+6)%7)-((b+6)%7)).map(d=>nomes[d]);
  const lista=ds.length>1?ds.slice(0,-1).join(', ')+' e '+ds[ds.length-1]:ds[0];
  const fmt=x=>x.split('-').reverse().join('/');
  return 'Toda semana: '+lista+', às '+r.hora+(r.fim?'. Até '+fmt(r.fim)+'.':'.');
}

  else if(ui.tab==='pacientes') h+=viewPacientes();
  else if(ui.tab==='tipos') h+=viewTipos();
  else h+=viewEmpresas();
  h+='<p class="foot" id="foot">'+esc(statusText())+'</p>';
  $('#view').innerHTML=h;
  if(ui.tab==='pacientes') renderPatientList();
}

function viewAgenda(){
  const ws=fromIso(ui.weekStart),today=iso(new Date());
  const days=[0,1,2,3,4,5,6].map(i=>addDays(ws,i));
  const a=iso(days[0]),b=iso(days[6]);
  const wk=visitsBetween(a,b);
  const active=wk.filter(v=>v.status!=='cancelado');
  const strip=days.map(function(d){
    const k=iso(d),n=wk.filter(v=>v.date===k&&v.status!=='cancelado').length;
    const cls='day'+(k===ui.day?' sel':'')+(k===today?' today':'');
    return '<button type="button" class="'+cls+'" data-action="pick-day" data-day="'+k+'"'+(k===today?' aria-current="date"':'')+' aria-pressed="'+(k===ui.day)+'" aria-label="'+esc(dayTitle(d)+', '+n+(n===1?' atendimento':' atendimentos'))+'">'+
      '<span class="dw">'+WD[d.getDay()]+'</span><span class="dn">'+d.getDate()+'</span><span class="dots">'+'<i></i>'.repeat(Math.min(n,3))+'</span></button>';
  }).join('');
  const dayVisits=visitsBetween(ui.day,ui.day).sort((x,y)=>x.hora.localeCompare(y.hora));
  let nextId=null;
  if(ui.day===today){
    const hm=nowKey().slice(11);
    const nx=dayVisits.find(v=>v.status==='agendado'&&v.hora>=hm);
    if(nx) nextId=nx.id;
  }
  const dd=fromIso(ui.day);
  let list;
  if(!dayVisits.length){
    list='<div class="empty"><p>Nenhum atendimento em '+esc(dayTitle(dd).toLowerCase())+'.</p><button type="button" class="btn small" data-action="new-visit" data-date="'+ui.day+'">Agendar atendimento</button></div>';
  }else{
    list='<ol class="route">'+dayVisits.map(function(v){
      const p=findPatient(v.pacienteId);
      const nm=p?p.nome:'Paciente removido';
      const meta=[v.tipo||'Atendimento',p&&p.bairro].filter(Boolean).join(' · ');
      let side='';
      if(v.status==='feito') side+='<span class="badge feito">'+ic('check')+'Realizado</span>';
      else if(v.status==='cancelado') side+='<span class="badge cancelado">Cancelado</span>';
      else if(v.id===nextId) side+='<span class="badge next">Próximo</span>';
      return '<li class="stop '+v.status+(v.id===nextId?' next':'')+'"><time class="stop-time" datetime="'+v.date+'T'+esc(v.hora)+'">'+esc(v.hora)+'</time><span class="rail" aria-hidden="true"><i class="node"></i></span>'+
        '<button type="button" class="stop-card" data-action="open-visit" data-id="'+v.id+'"><span class="stop-main"><span class="stop-name">'+esc(nm)+exTag(v)+(v.serie?repMark():'')+'</span><span class="stop-meta">'+esc(meta)+'</span>'+(p?chip(p.empresaId):'')+'</span><span class="stop-side">'+side+'</span></button></li>';
    }).join('')+'</ol>';
  }
  const n=active.length;
  return '<div class="weekbar"><button type="button" class="btn small" data-action="week-prev">'+ic('left')+'Anterior</button><button type="button" class="btn small ghost" data-action="week-today">Hoje</button><button type="button" class="btn small" data-action="week-next">Próxima'+ic('right')+'</button></div>'+
    '<div class="weekstrip">'+strip+'</div>'+
    '<p class="weeksum"><strong>'+n+(n===1?' atendimento':' atendimentos')+'</strong> na semana</p>'+
    '<div class="dayhead"><h2>'+esc(dayTitle(dd))+'</h2><span>'+dayVisits.filter(v=>v.status!=='cancelado').length+' no dia</span></div>'+list;
}

function viewPacientes(){

    f='<div class="filters" role="group" aria-label="Filtrar por empresa"><button type="button" class="fchip'+(ui.fcomp==='all'?' sel':'')+'" data-action="filter" data-id="all">Todos</button>'+
      S.companies.map(c=>'<button type="button" class="fchip'+(ui.fcomp===c.id?' sel':'')+'" data-action="filter" data-id="'+c.id+'">'+esc(c.nome)+'</button>').join('')+
      '<button type="button" class="fchip'+(ui.fcomp==='none'?' sel':'')+'" data-action="filter" data-id="none">Particulares</button></div>';
  }
  return '<button type="button" class="btn rep-btn" data-action="open-report" data-by="paciente">'+ic('chart')+'Relatório de faturamento</button><div class="search">'+ic('search')+'<label for="q" class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);margin:0">Buscar paciente</label><input id="q" type="search" placeholder="Buscar por nome, bairro ou empresa" value="'+esc(ui.q)+'" autocomplete="off"></div>'+f+'<div id="plist"></div>';

function renderPatientList(){
  const el=$('#plist');if(!el) return;
  const q=norm(ui.q);
  const list=S.patients.filter(function(p){
    if(ui.fcomp==='none'){if(p.empresaId&&findCompany(p.empresaId)) return false;}
    else if(ui.fcomp!=='all'&&p.empresaId!==ui.fcomp) return false;
    if(!q) return true;
    const c=findCompany(p.empresaId);
    return norm([p.nome,p.bairro,p.endereco,c&&c.nome].join(' ')).indexOf(q)>-1;
  }).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
  if(!S.patients.length){
    el.innerHTML='<div class="empty"><p>Nenhum paciente cadastrado. Cadastre o primeiro para montar sua agenda.</p><button type="button" class="btn small primary" data-action="new-patient">Cadastrar paciente</button></div>';
    return;
  }
  if(!list.length){el.innerHTML='<div class="empty"><p>Nenhum paciente encontrado.</p></div>';return;}
  el.innerHTML='<ul class="group">'+list.map(function(p){
    const a=age(p.nasc);
    const sub=[a!=null?a+' anos':'',p.bairro].filter(Boolean).join(' · ')||'Sem endereço';
    return '<li><button type="button" class="row" data-action="open-patient" data-id="'+p.id+'">'+avatar(p)+'<span class="row-main"><span class="row-name">'+esc(p.nome)+exTag(p)+repIcon(p)+'</span><span class="row-sub">'+esc(sub)+'</span>'+chip(p.empresaId)+'</span></button></li>';
  }).join('')+'</ul>';
}

  const list=tiposList();

function viewEmpresas(){
  if(!S.companies.length) return '<div class="empty"><p>Nenhuma empresa cadastrada. Cadastre as empresas para as quais você presta serviço e vincule seus pacientes a elas.</p><button type="button" class="btn small primary" data-action="new-company">Cadastrar empresa</button></div>';

/* ---------- janelas ---------- */
let lastFocus=null;
function setInert(on){
  ['#app','#fab','#tabbar'].forEach(function(s){const e=$(s);if(e){if(on) e.setAttribute('inert','');else e.removeAttribute('inert');}});
  document.body.style.overflow=on?'hidden':'';
}
function openSheet(title,body){
  if($('#sheet-root').firstChild) closeSheet(true);
  else lastFocus=document.activeElement;
  $('#sheet-root').innerHTML='<div class="scrim" data-action="close-sheet"></div><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-head"><h2 id="sheet-title" tabindex="-1">'+esc(title)+'</h2><button type="button" class="icon-btn" data-action="close-sheet" aria-label="Fechar">'+ic('x')+'</button></div><div class="sheet-body">'+body+'</div></section>';
  setInert(true);
  const h=$('#sheet-title');if(h) h.focus();
}
function closeSheet(keep){
  $('#sheet-root').innerHTML='';
  setInert(false);
  if(!keep&&lastFocus&&document.contains(lastFocus)){try{lastFocus.focus();}catch(e){}}
}
let toastT=null;
function toast(msg){
  const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},2600);
}
function copyText(txt){
  const done=function(){toast('Copiado.');};
  const fail=function(){toast('Não foi possível copiar. Selecione o texto e copie.');};
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done,fail);
    else fail();
  }catch(e){fail();}
}
function moveBlock(){
  return '<div class="confirm" id="move-confirm" role="alert" hidden><p id="move-msg"></p><div class="two"><button type="button" class="btn danger" data-action="confirm-move">Confirmar mudança</button><button type="button" class="btn" data-action="cancel-move">Voltar</button></div></div>';
}
function askMove(f,html){
  const c=f.querySelector('#move-confirm'),a=f.querySelector('.sheet-actions');
  f.querySelector('#move-msg').innerHTML=html;
  c.hidden=false;if(a) a.hidden=true;
  const e=f.querySelector('#f-err');if(e) e.textContent='';
  const b=c.querySelector('[data-action="confirm-move"]');
  c.scrollIntoView({block:'nearest'});if(b) b.focus({preventScroll:true});
}
function clearMove(f){
  const c=f.querySelector('#move-confirm'),a=f.querySelector('.sheet-actions');
  if(c) c.hidden=true;if(a) a.hidden=false;delete f.dataset.moveOk;
}
function askBlock(id,msg,action,dataId){
  return '<button type="button" class="btn danger" id="ask-'+id+'" data-action="ask" data-confirm="cf-'+id+'">Excluir</button>'+
    '<div class="confirm" id="cf-'+id+'" hidden><p>'+msg+'</p><div class="two"><button type="button" class="btn danger" data-action="'+action+'" data-id="'+dataId+'">Excluir</button><button type="button" class="btn" data-action="unask" data-confirm="cf-'+id+'" data-ask="ask-'+id+'">Manter</button></div></div>';
}
function kv(label,html,extra){
  return '<div><div class="grow"><span class="k">'+label+'</span><div class="v">'+html+'</div>'+(extra||'')+'</div></div>';
}
function copyBtn(txt,label){
  return '<button type="button" class="icon-btn sm" data-action="copy" data-text="'+esc(txt)+'" aria-label="'+esc(label)+'">'+ic('copy')+'</button>';
}
function kvCopy(label,txt,extra,copyLabel){
  return '<div><div class="grow"><span class="k">'+label+'</span><div class="v">'+esc(txt)+'</div>'+(extra||'')+'</div>'+copyBtn(txt,copyLabel||('Copiar '+label.toLowerCase()))+'</div>';
}

    '<p><span class="badge '+v.status+'">'+st+'</span> <span class="lead">'+esc(v.tipo||'Atendimento')+'</span></p>';
  if(p&&p.alergias) b+='<p class="alert"><strong>Alergias:</strong> '+esc(p.alergias)+'</p>';

  if(p&&p.ref) b+=kv('Como chegar e acessar',esc(p.ref));
  if(p&&p.tel) b+=kvCopy('Telefone',p.tel,'','Copiar telefone');
  if(p&&p.respNome) b+=kvCopy('Responsável',p.respNome+(p.respTel?', '+p.respTel:''),'','Copiar contato do responsável');
  if(v.obs) b+=kv('Observação deste atendimento',esc(v.obs));

  if(v.status==='agendado') b+='<button type="button" class="btn primary" data-action="visit-status" data-id="'+v.id+'" data-status="feito">'+ic('check')+'Marcar como realizado</button>';
  else b+='<button type="button" class="btn primary" data-action="visit-status" data-id="'+v.id+'" data-status="agendado">Voltar para agendado</button>';
  b+='<div class="two"><button type="button" class="btn" data-action="edit-visit" data-id="'+v.id+'">Remarcar ou editar</button>'+(p?'<button type="button" class="btn" data-action="open-patient" data-id="'+p.id+'">Ficha do paciente</button>':'<span></span>')+'</div>';
  if(v.status==='agendado') b+='<button type="button" class="btn" data-action="visit-status" data-id="'+v.id+'" data-status="cancelado">Cancelar atendimento</button>';
  b+=askBlock('v'+v.id,'Excluir este atendimento da agenda?','do-delete-visit',v.id)+'</div>';

}

  let b='<div class="sum">'+avatar(p,'lg')+'<div><h3>'+esc(p.nome)+exTag(p)+'</h3><p>'+(a!=null?a+' anos':'Idade não informada')+'</p></div></div>'+

  if(addr) b+=kvCopy('Endereço',addr,'<a href="'+mapsUrl(addr)+'" target="_blank" rel="noopener noreferrer">'+ic('external')+'Abrir no mapa</a>','Copiar endereço');
  if(p.ref) b+=kv('Como chegar e acessar',esc(p.ref));

  let c='';

  if(p.respNome) c+=kvCopy('Responsável',p.respNome+(p.respTel?', '+p.respTel:''),'','Copiar contato do responsável');
  if(c) b+='<div class="panel kv">'+c+'</div>';

  if(p.medicamentos) h+=kv('Medicamentos em uso',esc(p.medicamentos));
  if(p.obs) h+=kv('Observações importantes',esc(p.obs));
  if(h) b+='<div class="panel kv">'+h+'</div>';
  if(ups.length){
    b+='<div class="panel"><ul class="ups">'+ups.map(function(v){const d=fromIso(v.date);return '<li><span>'+WD[d.getDay()]+', '+pad(d.getDate())+'/'+pad(d.getMonth()+1)+' às '+esc(v.hora)+'</span><span>'+esc(v.tipo||'Atendimento')+'</span></li>';}).join('')+'</ul></div>';

    askBlock('p'+p.id,'Excluir '+esc(p.nome)+' e todos os atendimentos dessa pessoa?','do-delete-patient',p.id)+'</div>';

function saveTipo(f){

  if(!nome) return fail(f,'Informe o nome do tipo.','nome');

  if(old) renameTipo(old,nome);else addTipo(nome);

function fail(f,msg,field){
  const e=$('#f-err');if(e) e.textContent=msg;
  const x=f.elements[field];if(x&&x.focus) x.focus();else if(x&&x[0]) x[0].focus();
}
function readForm(f){
  const o={};
  Array.prototype.forEach.call(f.elements,function(el){
    if(!el.name||el.type==='checkbox') return;
    const t=String(el.value||'').trim();
    if(el.dataset&&el.dataset.kind==='date') o[el.name]=t===''?'':(brToIso(t)||'invalid');
    else if(el.dataset&&el.dataset.kind==='time') o[el.name]=t===''?'':(parseTime(t)||'invalid');
    else o[el.name]=t;
  });
  return o;
}

function savePatient(f){
  const o=readForm(f);
  if(!o.nome) return fail(f,'Informe o nome do paciente.','nome');
  const valor=parseMoney(o.valor);
  if(valor!==null&&isNaN(valor)) return fail(f,'Informe um valor válido, como 150,00.','valor');
  if(o.nasc==='invalid') return fail(f,'Informe a data de nascimento como dia/mês/ano, por exemplo 12/03/1944.','nasc');
  let rec=null;
  if(f.elements.recAtivo&&f.elements.recAtivo.checked){
    const dias=Array.prototype.map.call(f.querySelectorAll('input[name="dia"]:checked'),x=>Number(x.value)).sort((a,b)=>a-b);
    if(!dias.length) return fail(f,'Escolha ao menos um dia da semana.','dia');
    if(!o.recHora||o.recHora==='invalid') return fail(f,'Informe um horário válido, como 08:30.','recHora');
    if(o.recTipo==='__novo') return fail(f,'Digite o nome do novo tipo e toque em Adicionar, ou escolha outro tipo.','recTipo');
    if(!o.recInicio||o.recInicio==='invalid') return fail(f,'Informe quando os atendimentos começam, como 16/11/2026.','recInicio');
    if(o.recFim==='invalid') return fail(f,'Informe a data final como dia/mês/ano.','recFim');
    if(o.recFim&&o.recFim<o.recInicio) return fail(f,'A data final precisa ser depois da data inicial.','recFim');
    rec={ativo:true,dias:dias,hora:o.recHora,tipo:o.recTipo,inicio:o.recInicio,fim:o.recFim};
  }
  const data={nome:o.nome,nasc:o.nasc,tel:o.tel,respNome:o.respNome,respTel:o.respTel,endereco:o.endereco,bairro:o.bairro,ref:o.ref,empresaId:o.empresaId,valor:valor,condicoes:o.condicoes,alergias:o.alergias,medicamentos:o.medicamentos,obs:o.obs,rec:rec};
  const id=f.dataset.id;
  if(id){
    const p=findPatient(id);
    const antes=p?findCompany(p.empresaId):null;
    if(p&&antes&&(o.empresaId||'')!==p.empresaId&&!f.dataset.moveOk){
      const novo=findCompany(o.empresaId);
      return askMove(f,'<strong>Desvincular '+esc(p.nome)+' de '+esc(antes.nome)+'?</strong> O paciente '+(novo?'passa a ser atendido por <strong>'+esc(novo.nome)+'</strong>':'passa a ser <strong>particular</strong>')+'. Os atendimentos já agendados e o valor cadastrado continuam como estão.');
    }
    if(p){
      if(p.rec&&p.rec.ativo&&recSig(p.rec)!==recSig(rec)) closeRecurrence(p);
      Object.assign(p,data);
    }
  }
  else S.patients.push(Object.assign({id:uid()},data));
  commit();closeSheet(true);lastFocus=null;renderAll();
  toast(id?'Cadastro atualizado.':'Paciente cadastrado.');
}
function saveCompany(f){
  const o=readForm(f);
  if(!o.nome) return fail(f,'Informe o nome da empresa.','nome');
  const valor=parseMoney(o.valorPadrao);
  if(valor!==null&&isNaN(valor)) return fail(f,'Informe um valor válido, como 180,00.','valorPadrao');
  const data={nome:o.nome,tipo:o.tipo,contato:o.contato,valorPadrao:valor,pagamento:o.pagamento,obs:o.obs};
  const id=f.dataset.id;
  if(id){const c=findCompany(id);if(c) Object.assign(c,data);}
  else S.companies.push(Object.assign({id:uid(),cor:S.companies.length%6},data));
  commit();closeSheet(true);lastFocus=null;renderAll();
  toast(id?'Empresa atualizada.':'Empresa cadastrada.');
}
function saveVisit(f){
  const o=readForm(f);
  if(!o.pacienteId) return fail(f,'Escolha o paciente.','pacienteId');
  if(!o.date||o.date==='invalid') return fail(f,'Informe uma data válida, como 16/11/2026.','date');
  if(o.tipo==='__novo') return fail(f,'Digite o nome do novo tipo e toque em Adicionar, ou escolha outro tipo.','tipo');
  if(!o.hora||o.hora==='invalid') return fail(f,'Informe um horário válido, como 08:30.','hora');
  const id=f.dataset.id;
  let msg=null;
  if(id){
    const v=resolveVisit(id);
    if(v){
      const moved=v.date!==o.date||v.hora!==o.hora;
      Object.assign(v,{pacienteId:o.pacienteId,date:o.date,hora:o.hora,tipo:o.tipo,obs:o.obs,manual:true});
      if(moved){
        if(v.status==='cancelado'||(v.status==='feito'&&(o.date+' '+o.hora)>nowKey())) v.status='agendado';
        const d=fromIso(o.date);
        msg='Atendimento remarcado para '+WD[d.getDay()]+', '+pad(d.getDate())+'/'+pad(d.getMonth()+1)+' às '+o.hora+'.';
      }
    }
  }else{
    const n=Math.max(1,Number(o.rep)||1),d0=fromIso(o.date);
    for(let i=0;i<n;i++) S.visits.push({id:uid(),pacienteId:o.pacienteId,date:iso(addDays(d0,7*i)),hora:o.hora,tipo:o.tipo,obs:o.obs,status:'agendado'});
  }
  commit();closeSheet(true);lastFocus=null;
  ui.tab='agenda';ui.day=o.date;ui.weekStart=iso(startOfWeek(fromIso(o.date)));
  renderAll();window.scrollTo(0,0);
  toast(msg||(id?'Atendimento atualizado.':'Atendimento agendado.'));
}

    const id=el.dataset.id;
    S.companies=S.companies.filter(c=>c.id!==id);
    S.patients.forEach(function(p){if(p.empresaId===id) p.empresaId='';});
    if(ui.fcomp===id) ui.fcomp='all';
    commit();closeSheet();renderAll();toast('Empresa excluída.');
  },
  'ask':function(el){const c=document.getElementById(el.dataset.confirm);if(c){c.hidden=false;el.hidden=true;}},
  'unask':function(el){const c=document.getElementById(el.dataset.confirm),a=document.getElementById(el.dataset.ask);if(c) c.hidden=true;if(a) a.hidden=false;},
  'copy':function(el){copyText(el.dataset.text);},
  'clear-demo':function(){
    S.patients=S.patients.filter(x=>!x.ex);S.companies=S.companies.filter(x=>!x.ex);S.visits=S.visits.filter(x=>!x.ex);
    if(ui.fcomp!=='all'&&ui.fcomp!=='none'&&!findCompany(ui.fcomp)) ui.fcomp='all';
    commit();renderAll();toast('Exemplos apagados.');
  },
  'open-cal':function(el){const w=el.closest('.datef');if($('.cal',w).hidden) calOpen(w);else calClose(w,false);},
  'cal-nav':function(el){
    const w=el.closest('.datef'),cal=$('.cal',w);
    let y=+cal.dataset.y,m=+cal.dataset.m+Number(el.dataset.dir);
    if(m<0){m=11;y--;}else if(m>11){m=0;y++;}
    cal.dataset.y=y;cal.dataset.m=m;calRender(w);
  },
  'cal-pick':function(el){calSet(el.closest('.datef'),el.dataset.iso);},
  'cal-today':function(el){calSet(el.closest('.datef'),iso(new Date()));},
  'cal-clear':function(el){calSet(el.closest('.datef'),'');},
  'open-time':function(el){const w=el.closest('.datef');if($('.cal',w).hidden) timeOpen(w);else calClose(w,false);},
  'wheel-pick':function(el){
    const wh=el.closest('.wheel');
    wheelGo(wh,Array.prototype.indexOf.call(wh.querySelectorAll('.wi'),el),false);
  },
  'time-done':function(el){const w=el.closest('.datef');timeApply(w);calClose(w,true);},
  'close-sheet':function(){closeSheet();}
};

document.addEventListener('click',function(e){
  const el=e.target.closest('[data-action]');
  if(!el) return;
  const fn=A[el.dataset.action];
  if(fn) fn(el,e);
});
document.addEventListener('submit',function(e){
  e.preventDefault();
  const f=e.target;
  if(f.id==='f-patient') savePatient(f);
  else if(f.id==='f-company') saveCompany(f);
  else if(f.id==='f-visit') saveVisit(f);
  else if(f.id==='f-tipo') saveTipo(f);
  else if(f.id==='f-link') saveLink(f);
  else if(f.id==='f-entrar') doEntrar(f);
  else if(f.id==='f-criar') doCriar(f);
  else if(f.id==='f-reset') doReset(f);
  else if(f.id==='f-senha') doSenha(f);
  else if(f.id==='f-perfil') saveProfile(f);
});
document.addEventListener('input',function(e){
  const t=e.target;
  if(t&&t.id==='q'){ui.q=t.value;renderPatientList();}
  if(t&&t.dataset&&t.dataset.role==='link-q'){const q=norm(t.value);document.querySelectorAll('#lk-list .lrow').forEach(function(l){l.parentNode.hidden=q&&l.dataset.n.indexOf(q)<0;});}
  else if(t&&t.dataset&&t.dataset.kind==='time'){
    maskTime(t);
    const w=t.closest('.datef');
    if(!$('.cal',w).hidden&&parseTime(t.value)) timeSync(w);
  }
  else if(t&&t.dataset&&t.dataset.kind==='date'){
    maskDate(t);
    const w=t.closest('.datef'),cal=$('.cal',w);
    if(!cal.hidden){
      const i=brToIso(t.value);
      if(i){const d=fromIso(i);cal.dataset.y=d.getFullYear();cal.dataset.m=d.getMonth();}
      calRender(w);
    }
  }
});
document.addEventListener('change',function(e){
  const t=e.target;
  if(t&&t.dataset&&t.dataset.role==='rep-emp'){
    ui.rep.emp=t.value;
    const p=findPatient(ui.rep.pac);
    if(p&&ui.rep.emp!=='all'&&(ui.rep.emp==='none'?!noCompany(p):p.empresaId!==ui.rep.emp)) ui.rep.pac='all';
    repRender('r-emp');
  }
  if(t&&t.dataset&&t.dataset.role==='rep-pac'){ui.rep.pac=t.value;repRender('r-pac');}
  if(t&&t.name==='empresaId'){const f=t.closest('form');if(f) clearMove(f);}
  if(t&&t.dataset&&t.dataset.kind==='tipo'){
    const box=$('.tipo-new',t.closest('.tipof')),show=t.value==='__novo';
    box.hidden=!show;
    if(show){const i=$('input',box);if(i) i.focus();}
  }
});
document.addEventListener('keydown',function(e){
  const t=e.target;
  if(e.key==='Enter'&&t&&t.dataset&&t.dataset.role==='tipo-new'){e.preventDefault();A['tipo-add'](t);return;}
  if(e.key==='Escape'){
    const open=Array.prototype.find.call(document.querySelectorAll('.datef'),w=>!$('.cal',w).hidden);
    if(open){calClose(open,true);return;}
    if($('#sheet-root').firstChild) closeSheet();
    return;
  }
  if(t&&t.classList&&t.classList.contains('cal-day')){
    const step={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7}[e.key];
    if(step){
      const items=Array.prototype.slice.call(t.parentNode.querySelectorAll('.cal-day'));
      const nx=items[items.indexOf(t)+step];
      if(nx){e.preventDefault();nx.focus();}
    }
  }
  if(t&&t.classList&&t.classList.contains('wheel')){
    const step={ArrowUp:-1,ArrowDown:1,PageUp:-5,PageDown:5}[e.key];
    if(step){e.preventDefault();wheelGo(t,wheelIdx(t)+step,true);}
    else if(e.key==='Home'){e.preventDefault();wheelGo(t,0,true);}
    else if(e.key==='End'){e.preventDefault();wheelGo(t,99,true);}
  }
});

/* ---------- início ---------- */
initState();
try{if(window.claude&&window.claude.use) window.claude.use('downloads').then(function(d){dlRef=d||null;},function(){});}catch(e){}
setTimeout(function(){if(!contaChecked){contaChecked=true;decideGate();}},4500);
decideGate();
initDb();
})();
</script>
